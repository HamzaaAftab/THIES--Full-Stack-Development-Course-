<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="income-section">
            <h2>Set Total Income</h2>
            <input type="number" id="totalIncomeInput" placeholder="Enter your total income">
            <button onclick="setTotalIncome()">Set Income</button>
            <h3 id="totalIncomeDisplay">Total Income: $0</h3>
        </div>

        <div class="expense-section">
            <h2>Add Expense</h2>
            <input type="text" id="expenseName" placeholder="Expense Name">
            <input type="number" id="expenseAmount" placeholder="Expense Amount">
            <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="balance-section">
            <h3 id="balance">Balance: $0</h3>
        </div>

        <div class="expense-list-section">
            <h2>Expenses</h2>
            <ul id="expenseList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
